name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_name == 'main' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  integration-test:
    name: Integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Standard public-repository runners avoid metered larger runners.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          # A cold run is the evidence; no cache storage is needed.
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
          cache-save: false
      - name: Key computation
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
      # The rule runs the first python3 on PATH, which on a Mac without another
      # Python is the older one Xcode provides.
      - name: Key computation on Xcode's Python
        if: runner.os == 'macOS'
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: Host changes reach action keys
        run: python3 tests/check_platform.py
      - name: Verify prepared release archive
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 tools/prepare_release.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@f05f17a38ba2dfbaf0cde130a375b346e9a923a2 # v0.2.0

  conclusion:
    needs: [integration-test, lint, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every integration and lint job to pass
        env:
          INTEGRATION: ${{ needs.integration-test.result }}
          LINT: ${{ needs.lint.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$INTEGRATION" = success && test "$LINT" = success && test "$BASELINE" = success
